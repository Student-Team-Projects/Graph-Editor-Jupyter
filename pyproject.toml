[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graph-editor-jupyter"
version = "0.1.0.dev0"
authors = [
  { name="Urszula Wójcik"},
  { name="Urszula Pilśniak"},
  { name="Antonina Olejnik"},
  { name="Andrii Kovryhin"},
  { name="Maksym Tur"},
  { name="Denis Logunov"},
  { name="Izabella Tylek"},
  { name="Andrzej Kwaśniewski"},
  { name="Augustyn Majtyka"},
  { name="Roman Gicała"},
  { name="Rafał Przypek"},
  { name="Artsiom Tkach"},
  { name="Zakhar Tsvirka"},
  { name="Roman Volochai"},
]
description = "Graph editor for Jupyter"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
]
dependencies = [
    "anywidget>=0.11",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "traitlets>=5.14",
]

[project.optional-dependencies]
dev = ["jupyterlab", "pytest"]

[project.urls]
Homepage = "https://github.com/Student-Team-Projects/Graph-Editor-Jupyter"
Issues = "https://github.com/Student-Team-Projects/Graph-Editor-Jupyter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_editor_jupyter"]
# Built by `npm run build` in js/; ignored by git but shipped in the package.
artifacts = ["src/graph_editor_jupyter/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
